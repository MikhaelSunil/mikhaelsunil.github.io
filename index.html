<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Set the theme before anything paints, so there is no white flash
       for someone who chose dark last time. -->
  <script>
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('ms-theme') ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- ===================================================================
       These tags are overwritten at load time from content/site.js (meta).
       Edit them there, not here — these are only the no-JavaScript values.
       =================================================================== -->

  <meta name="description" content="Portfolio of Mikhael Sunil — robotics developer working on decentralized control for aerial swarms, model-based and learning-based control for ground and aerial manipulators, and rehabilitation exoskeletons." />

  <!-- ===================================================================
       DESIGN TOKENS — change a colour here and it changes site-wide.
       Mirror any colour change in assets/css/style.css (:root) too.
       =================================================================== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          /* These read the CSS tokens in assets/css/style.css, which is what
             makes light/dark a single swap. The <alpha-value> placeholder
             keeps text-ink/85, bg-paper/70 and friends working. */
          colors: {
            paper:      'rgb(var(--c-paper) / <alpha-value>)',
            cream:      'rgb(var(--c-cream) / <alpha-value>)',
            ink:        'rgb(var(--c-ink) / <alpha-value>)',
            muted:      'rgb(var(--c-muted) / <alpha-value>)',
            signal:     'rgb(var(--c-signal) / <alpha-value>)',
            amberretro: 'rgb(var(--c-amber) / <alpha-value>)',
            kraft:      'rgb(var(--c-kraft) / <alpha-value>)',
            scope:      'rgb(var(--c-scope) / <alpha-value>)'
          },
          /* One typeface throughout — headings, body and labels alike. */
          fontFamily: {
            display: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            sans:    ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            mono:    ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          boxShadow: {
            hard:        '4px 4px 0px rgb(var(--c-ink))',
            'hard-sm':   '2px 2px 0px rgb(var(--c-ink))',
            'hard-lg':   '6px 6px 0px rgb(var(--c-ink))',
            'hard-signal': '4px 4px 0px rgb(var(--c-signal))'
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="assets/css/style.css?v=11" />

  <!-- =========================================================
       STICKY ROBOTIC FORKLIFT NAVIGATION BAR
       The tabs themselves are generated from content/sections.js
       ========================================================= -->
  <header id="nav-header" class="sticky top-0 z-30 bg-cream border-b-2 border-ink">
    <div class="h-1.5 w-full hazard-rail border-b border-ink"></div>

    <div class="max-w-6xl mx-auto px-3 sm:px-6 pt-2 pb-2.5">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-2 md:gap-6">

        <!-- On phones the brand and the theme switch share one row above the
             nav; from md up they sit at the two ends of the bar. -->
        <div class="flex items-center justify-between gap-3 md:contents">
          <a href="#home" id="brand-name" class="shrink-0 pb-1 font-display font-bold text-base sm:text-lg tracking-tight text-ink hover:text-signal transition-colors md:order-1">
            Mikhael Sunil

          <div class="theme-zone shrink-0 md:order-3 md:pb-1">
            <button id="theme-toggle" type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Switch between light and dark mode">
              <span class="theme-ic sun" aria-hidden="true">&#9728;</span>
              <span class="theme-ic moon" aria-hidden="true">&#9790;</span>
              <span class="theme-knob"></span>
            </button>
            <svg class="theme-smiley" viewBox="0 0 40 40" aria-hidden="true">
              <circle class="face" cx="20" cy="20" r="16" />
              <g class="eye-open">
                <circle class="pupil" cx="14.5" cy="16.5" r="2" />
                <circle class="pupil" cx="25.5" cy="16.5" r="2" />
              </g>
              <g class="eye-shut">
                <path class="feat" d="M11.5 17 Q14.5 14.2 17.5 17" />
                <path class="feat" d="M22.5 17 Q25.5 14.2 28.5 17" />
              </g>
              <path class="feat" d="M13 25 Q20 30 27 25" />
            </svg>
          </div>
        </div>

        <div id="nav-zone" class="relative flex-1 max-w-3xl overflow-x-auto no-scrollbar pt-1 md:order-2">
          <div id="nav-stage" class="relative">

            <!-- Flight line the aerial manipulator hovers along -->
            <div id="nav-rail" class="relative h-[44px] w-full select-none pointer-events-none">
              <div class="absolute bottom-[5px] inset-x-0 h-[2px] bg-ink/20"
                   style="background-image: repeating-linear-gradient(to right, currentColor 0 6px, transparent 6px 12px); color: rgb(var(--c-ink) / 0.3); background-color: transparent;"></div>

              <!-- Side-profile aerial manipulator: a quadcopter with a
                   two-link arm that reaches down and grips the active tab. -->
              <div id="nav-drone"
                   class="absolute bottom-[1px] left-0 will-change-transform"
                   style="width: 62px; height: 48px; transform: translateX(0px);">
                <svg id="nav-drone-svg" viewBox="0 0 80 62" class="w-full h-full overflow-visible" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <g transform="translate(40, 22)">
                    <g id="nav-drone-flip">

                      <!-- Booms, angled up to the motors -->
                      <line x1="-11" y1="-2" x2="-25" y2="-9" stroke="#1C1B18" stroke-width="2.4" stroke-linecap="round" />
                      <line x1="11" y1="-2" x2="25" y2="-9" stroke="#1C1B18" stroke-width="2.4" stroke-linecap="round" />

                      <!-- Motor pods -->
                      <rect x="-28" y="-13" width="6" height="4.4" rx="1.4" fill="#1C1B18" />
                      <rect x="22" y="-13" width="6" height="4.4" rx="1.4" fill="#1C1B18" />
                      <line x1="-25" y1="-13" x2="-25" y2="-14.6" stroke="#1C1B18" stroke-width="1.6" />
                      <line x1="25" y1="-13" x2="25" y2="-14.6" stroke="#1C1B18" stroke-width="1.6" />

                      <!-- Propeller discs, seen edge-on -->
                      <ellipse id="rotor-l" cx="-25" cy="-15.2" rx="10.5" ry="0.95" fill="#D94E28" stroke="#1C1B18" stroke-width="0.9" />
                      <ellipse id="rotor-r" cx="25" cy="-15.2" rx="10.5" ry="0.95" fill="#2D6A4F" stroke="#1C1B18" stroke-width="0.9" />

                      <!-- Slim tapered airframe -->
                      <path d="M-17 0 L-13.5 -4.6 L11 -4.6 L16.5 -0.6 L15 3.4 L-13.5 3.4 Z"
                            fill="#D94E28" stroke="#1C1B18" stroke-width="2" stroke-linejoin="round" />
                      <path d="M-11.5 -3.2 L-3 -3.2 L-3 -0.4 L-11.5 -0.4 Z" fill="#D49B2A" stroke="#1C1B18" stroke-width="0.9" />
                      <line x1="1" y1="-4.4" x2="1" y2="3.2" stroke="#1C1B18" stroke-width="0.9" opacity="0.5" />

                      <!-- Avionics stack + beacon -->
                      <rect x="-5" y="-7.4" width="10" height="3" rx="1" fill="#1C1B18" />
                      <path id="nav-beacon" d="M-1.8 -7.4 A1.8 1.8 0 0 1 1.8 -7.4 Z" fill="#D49B2A" stroke="#1C1B18" stroke-width="1" />
                      <circle id="nav-beacon-glow" cx="0" cy="-8.4" r="5" fill="#2D6A4F" opacity="0" />

                      <!-- Landing skids -->
                      <line x1="-10" y1="3.4" x2="-12.5" y2="9.4" stroke="#1C1B18" stroke-width="1.8" stroke-linecap="round" />
                      <line x1="7" y1="3.4" x2="9.5" y2="9.4" stroke="#1C1B18" stroke-width="1.8" stroke-linecap="round" />
                      <path d="M-16.5 9.8 L13.5 9.8" stroke="#1C1B18" stroke-width="2" stroke-linecap="round" />

                      <!-- Stabilised camera gimbal: stays level as the body pitches -->
                      <g id="nav-gimbal">
                        <circle cx="12.5" cy="5.6" r="2.9" fill="#FAF7F0" stroke="#1C1B18" stroke-width="1.6" />
                        <circle cx="13.3" cy="5.6" r="1.2" fill="#2D6A4F" />
                      </g>

                      <!-- Two-joint manipulator: folds under the belly in
                           flight, unfolds straight down to grip a tab. -->
                      <g id="nav-arm-shoulder">
                        <line x1="-4" y1="3.4" x2="-4" y2="13.4" stroke="#1C1B18" stroke-width="2.4" stroke-linecap="round" />
                        <circle cx="-4" cy="13.4" r="1.9" fill="#FAF7F0" stroke="#1C1B18" stroke-width="1.3" />
                        <g id="nav-arm-elbow">
                          <line x1="-4" y1="13.4" x2="-4" y2="22" stroke="#E5C890" stroke-width="2.1" stroke-linecap="round" />
                          <line x1="-4" y1="13.4" x2="-4" y2="22" stroke="#1C1B18" stroke-width="0.8" opacity="0.5" />
                          <circle cx="-4" cy="22" r="1.5" fill="#FAF7F0" stroke="#1C1B18" stroke-width="1.2" />
                          <g id="nav-drone-jaws">
                            <path d="M-6.6 23 Q-6.9 25.8 -5.6 27.2" fill="none" stroke="#1C1B18" stroke-width="1.7" stroke-linecap="round" />
                            <path d="M-1.4 23 Q-1.1 25.8 -2.4 27.2" fill="none" stroke="#1C1B18" stroke-width="1.7" stroke-linecap="round" />
                          </g>
                        </g>
                      </g>
                      <!-- shoulder housing, drawn last so the joint reads as mounted -->
                      <rect x="-6.6" y="2.2" width="5.2" height="3.4" rx="1.2" fill="#1C1B18" />

                    </g>
                  </g>
                </svg>
              </div>
            </div>

            <!-- Nav tabs are injected here by assets/js/render.js -->
            <nav id="nav-track" class="nav-track" aria-label="Primary Navigation"></nav>

          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- =========================================================
       SCRIPTS — content first, then the renderer, then behaviour

       The ?v=11 on each file is a cache-buster. Browsers hang on to CSS and
       JS, so after you edit anything in content/ or assets/, bump that
       number (v=3, v=4 ...) on EVERY line below and visitors get the new
       version straight away instead of whenever their cache expires.
       ========================================================= -->
  <script src="content/site.js?v=11"></script>
  <script src="content/sections.js?v=11"></script>
  <script src="content/projects.js?v=11"></script>
  <script src="assets/js/projects.js?v=11"></script>
