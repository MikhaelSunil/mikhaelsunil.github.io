<!DOCTYPE html>

<head>

  <script>
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('ms-theme') ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        boxShadow: {
          hard:'4px 4px 0px rgb(var(--c-ink))', 'hard-sm':'2px 2px 0px rgb(var(--c-ink))',

<body class="font-sans text-ink antialiased selection:bg-signal selection:text-cream">

  <header class="subpage-header sticky top-0 z-30">
    <div class="h-1.5 w-full hazard-rail border-b border-ink"></div>
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <a href="../index.html" class="font-display font-bold text-base sm:text-lg tracking-tight text-ink hover:text-signal transition-colors">Mikhael Sunil</a>
      <div class="flex items-center gap-3">
        <a href="../index.html#projects" class="retro-btn px-3 py-1.5 bg-cream hover:bg-amberretro font-mono text-[11px] font-bold uppercase">&larr; Portfolio</a>
        <div class="theme-zone">
          <button id="theme-toggle" type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Switch between light and dark mode">

            <span class="theme-ic moon" aria-hidden="true">&#9790;</span>

        Everything from aerial manipulation and drone swarms to wearable rehabilitation hardware.
        The ones with a write-up are clickable; the rest are summarised here.
      </p>
    </div>
    <div id="showcase-root"></div>
    <noscript>
      <div class="retro-card p-6 font-mono text-sm mt-10">
        This page is assembled in the browser. Please enable JavaScript, or reach

      <a href="../index.html" class="underline hover:text-signal">Back to the portfolio</a>

  <script src="../content/site.js?v=10"></script>
  <script src="../content/projects.js?v=10"></script>
  <script src="../assets/js/projects.js?v=10"></script>
  <script src="../assets/js/ui.js?v=10"></script>
  <script src="../assets/js/cursor.js?v=10"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var y = document.getElementById('footer-year');
      if (y) y.textContent = new Date().getFullYear();
      window.MSProjects.renderShowcase(document.getElementById('showcase-root'));
      window.MSUI.init();
      window.MSCursor.init();
    });
